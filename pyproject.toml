[project]
name = "dwatcher"
description = "Download Watcher - watches a folder and auto-organizes completed downloads"
requires-python = ">=3.11"
license = {text = "MIT"}
dynamic = ["version"]

[tool.setuptools.dynamic]
version = {attr = "dwatcher.__version__"}

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
