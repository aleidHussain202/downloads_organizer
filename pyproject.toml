[project]
name = "dwatcher"
version = "0.1.0"
description = "Download Watcher - watches a folder and auto-organizes completed downloads"
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
